[package]
name = "sports-stats-core"
version = "0.1.0"
edition = "2021"
description = "Агрегация спортивной статистики (Rust core + PyO3)"

[lib]
name = "sports_stats_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", optional = true }

[features]
# По умолчанию без PyO3 — `cargo test` не требует Python на машине.
default = []
# Включается maturin при `maturin develop` / сборке wheel.
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dev-dependencies]
serde_json = "1"
